server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — 任何路徑找不到實體檔就回 index.html,交給 client-side router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不快取:每次拿新版才能載到 hash 換過的 assets
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # 靜態壓縮
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
